# Docker Compose for CafeSmart API (production-like TLS).
#
#   ./scripts/gen-dev-certs.sh   # once, for local self-signed PEMs
#   docker compose build
#   docker compose up app
#
# Learn more: https://docs.docker.com/compose/reference/

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MONGO_URL: ${MONGO_URL:-mongodb://host.docker.internal:27017/cafesmart}
  MLDSA_SEED: ${MLDSA_SEED:?set MLDSA_SEED}
  ADMIN_USERNAMES: ${ADMIN_USERNAMES:-admin@example.com}
  CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-https://localhost}
  USE_TEST_STORE: ${USE_TEST_STORE:-false}
  SEED_TEST_DATA: "false"
  HTTP_PORT: "8080"
  WS_HOST: "0.0.0.0"
  WS_PORT: "8081"
  API_LOCAL_FULL_CHAIN: /certs/fullchain.pem
  API_LOCAL_PRIV_KEY: /certs/privkey.pem

services:
  app:
    image: cafesmart-api:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${CERTS_DIR:-./certs}:/certs:ro
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
